apiVersion: apps/v1
kind: Deployment
metadata:
  name: chk-gsheet
  labels:
    app: chk-gsheet
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: chk-gsheet
  template:
    metadata:
      labels:
        app: chk-gsheet
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: chk-gsheet
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8002
          env:
            - name: DATABASE_URL
              value: {{ .Values.env.DATABASE_URL | quote }}
            - name: GOOGLE_CREDENTIALS_JSON
              valueFrom:
                secretKeyRef:
                  name: google-credentials
                  key: credentials.json
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10

